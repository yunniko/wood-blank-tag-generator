# No database — stateless tool, everything runs client-side from form inputs.
services:
  # Production-style app container — opt in with:
  #   docker compose --profile app up -d --build
  # (dev flow is just `npm run dev`, no compose needed)
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      ADSENSE_PUBLISHER_ID: ${ADSENSE_PUBLISHER_ID:-}
    ports:
      - "127.0.0.1:30290:3000"
